# mruby/c runtime (OpenBlink/mrubyc-zephyr module)
CONFIG_MRUBYC=y

# Console output for Ruby puts and printk
CONFIG_PRINTK=y

# GPIO for the on-board LEDs
CONFIG_GPIO=y

# Stack for the Zephyr main thread that runs the mruby/c scheduler
CONFIG_MAIN_STACK_SIZE=4096

# The 1 ms mruby/c HAL timer must be an integer number of system ticks
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
